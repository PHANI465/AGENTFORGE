name: Infra Apply

# Manual-only, deliberately: ADR-003 (CLAUDE.md) runs this project on a $0
# AWS budget with no always-on cloud resources — spin up, demo, tear down,
# not deploy-on-every-push. Auto-applying Terraform on merge would silently
# start real billing and risks unattended infra drift on a solo-maintained
# project with no infra review gate.
#
# `plan` always runs on dispatch. `apply` only runs if the triggering
# environment has required reviewers configured (Settings → Environments) —
# add yourself as a reviewer on "infra-prod" (and "infra-staging" if you
# want the same gate there) before the first real apply.
#
# `bootstrap_state`: check this ONLY for an environment's very first-ever
# run, with create_state_bucket = true in that environment's tfvars. It
# creates just the S3 bucket + DynamoDB lock table (module.s3) using pure
# local state — the backend block gets stripped from versions.tf for this
# run only (sed, below), since the bucket doesn't exist yet and a fresh
# directory can't partially-initialize against a backend that isn't there.
# Once that succeeds, set create_state_bucket back to false in the tfvars
# (the bucket becomes an out-of-band backend target from here on, not
# something this state tracks — leaving it true would make the next normal
# apply try to recreate a bucket that already exists) and run again with
# bootstrap_state unchecked, which initializes the real S3 backend and
# applies everything else with state that actually persists across runs.
#
# `destroy`: the teardown button — spins the whole environment back down so
# it stops billing (~$0.20+/hr for staging). Plan it first (destroy checked,
# apply unchecked) to review what gets removed, then re-run with apply also
# checked. Before Terraform destroys the cluster, a best-effort step
# uninstalls the app + LB controller so the ALB (created by the controller,
# NOT tracked in Terraform state) is torn down cleanly rather than orphaned.
# The S3 state bucket/lock table are intentionally NOT destroyed (they're
# out-of-band, count=0 in state), so the environment can be re-applied later
# without re-bootstrapping.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which envs/<name>.tfvars to plan/apply"
        required: true
        type: choice
        options: [dev, staging, prod]
      apply:
        description: "Actually apply (unchecked = plan only)"
        required: true
        type: boolean
        default: false
      bootstrap_state:
        description: "First-ever run for this environment only: create just the state bucket/lock table (see comment above)"
        required: true
        type: boolean
        default: false
      destroy:
        description: "Tear the environment down (terraform destroy) instead of building it up"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # AWS OIDC role assumption, same as cd.yml

jobs:
  plan:
    name: terraform ${{ inputs.destroy && 'destroy-' || '' }}plan (${{ inputs.environment }})
    runs-on: ubuntu-latest

    steps:
      - name: Reject bootstrap + destroy together
        if: inputs.bootstrap_state == true && inputs.destroy == true
        run: |
          echo "bootstrap_state and destroy are mutually exclusive — pick one." >&2
          exit 1

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # -backend=false only reuses an already-initialized local directory —
      # it doesn't fully initialize a *fresh* one when the config declares
      # a backend block, which just fails plan/apply right after with
      # "Backend initialization required". A genuinely absent backend
      # block is the only reliable way to get pure local state on a first
      # bootstrap run, so strip it from this checkout before init.
      - name: Disable backend block for bootstrap run
        if: inputs.bootstrap_state == true
        working-directory: infra/terraform
        run: sed -i '/backend "s3" {}/d' versions.tf

      - name: terraform init (bootstrap — local state)
        if: inputs.bootstrap_state == true
        working-directory: infra/terraform
        run: terraform init

      - name: terraform init (real S3 backend)
        if: inputs.bootstrap_state == false
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="bucket=agentforge-${{ inputs.environment }}-terraform-state" \
            -backend-config="key=${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="dynamodb_table=agentforge-${{ inputs.environment }}-terraform-locks"

      - name: terraform plan
        working-directory: infra/terraform
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        # envs/<env>.tfvars is gitignored (local-only, same pattern as
        # .env) and doesn't exist in a fresh CI checkout — the .example
        # file is the tracked, complete config (nothing sensitive lives in
        # it; db_password comes from TF_VAR_db_password above). If you've
        # customized envs/<env>.tfvars locally beyond the example (e.g. a
        # real domain_name), apply from your machine instead, or update
        # the .example file to match before running this. A -destroy plan,
        # applied, tears the environment down; -target=module.s3 is the
        # bootstrap-only carve-out.
        run: |
          terraform plan -var-file="envs/${{ inputs.environment }}.tfvars.example" \
            ${{ inputs.destroy == true && '-destroy' || '' }} \
            ${{ inputs.bootstrap_state == true && '-target=module.s3' || '' }} \
            -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: infra/terraform/tfplan
          retention-days: 1

  apply:
    name: terraform ${{ inputs.destroy && 'destroy' || 'apply' }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: [plan]
    if: inputs.apply == true
    # Requires this environment to exist under Settings → Environments with
    # "Required reviewers" set — that's what actually makes this a gated
    # step rather than firing immediately after plan.
    environment: infra-${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: azure/setup-helm@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # The ALB is created by the in-cluster AWS Load Balancer Controller in
      # response to the Ingress, and is NOT in Terraform state — so a plain
      # terraform destroy would leave it (and its target groups) orphaned and
      # still billing. Deleting the Ingress first makes the controller tear
      # the ALB down (its finalizer on the Ingress blocks deletion until the
      # ALB is actually gone, so this waits for real). Best-effort: if the
      # cluster is already gone/unreachable, skip and let terraform proceed
      # — worst case is the same manual orphan-check the old teardown script
      # always warned about.
      - name: Pre-destroy — remove app + LB controller so the ALB is cleaned up
        if: inputs.destroy == true
        continue-on-error: true
        run: |
          set +e
          aws eks update-kubeconfig --region ${{ vars.AWS_REGION || 'us-east-1' }} \
            --name agentforge-${{ inputs.environment }} || { echo "cluster unreachable — skipping k8s cleanup"; exit 0; }
          # Order matters. Delete the Ingress FIRST, while the LB controller is
          # still running — its finalizer on the Ingress blocks this delete
          # until the ALB (and the ENIs it plants in the VPC subnets) is
          # actually gone, so the --timeout is a real wait for teardown to
          # finish. Only AFTER that do we remove the app and the controller.
          # Doing `helm uninstall agentforge` first would delete the Ingress
          # object without waiting, letting us tear down the controller before
          # the ALB is gone — orphaning the ALB and leaving its ENIs holding a
          # subnet, which then fails terraform destroy with DependencyViolation.
          kubectl delete ingress --all -n default --ignore-not-found --timeout=8m || true
          helm uninstall agentforge -n default || true
          helm uninstall aws-load-balancer-controller -n kube-system || true
          helm uninstall external-dns -n kube-system || true

      - name: Disable backend block for bootstrap run
        if: inputs.bootstrap_state == true
        working-directory: infra/terraform
        run: sed -i '/backend "s3" {}/d' versions.tf

      - name: terraform init (bootstrap — local state)
        if: inputs.bootstrap_state == true
        working-directory: infra/terraform
        run: terraform init

      - name: terraform init (real S3 backend)
        if: inputs.bootstrap_state == false
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="bucket=agentforge-${{ inputs.environment }}-terraform-state" \
            -backend-config="key=${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="dynamodb_table=agentforge-${{ inputs.environment }}-terraform-locks"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: infra/terraform

      # Applying a saved -destroy plan performs the destruction; applying a
      # normal plan builds. Same command either way — the plan artifact
      # carries the intent.
      - name: terraform apply
        working-directory: infra/terraform
        run: terraform apply tfplan

      - name: Show outputs (copy the ARNs into repo secrets for cd.yml)
        if: inputs.destroy == false
        working-directory: infra/terraform
        run: terraform output
