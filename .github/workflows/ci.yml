name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Lint + test (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge
          POSTGRES_DB: agentforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Ruff lint
        run: uv run ruff check .

      - name: Run tests
        # tests/integration/api_gateway/conftest.py talks to Postgres on
        # localhost:5432 with the agentforge/agentforge creds — matches the
        # postgres service container above. ENCRYPTION_MASTER_KEY is a
        # throwaway key for CI only — encrypt_key()/decrypt_key() require
        # one to be set, real deployments generate their own.
        env:
          ENCRYPTION_MASTER_KEY: "41d6du78ymDknwOXO5oBmrZ-HTbRpGNnVzNzxQ2Ju5M="
        run: uv run pytest tests/ -q

  cli-go:
    name: Build + vet (Go CLI)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: packages/cli-go/go.sum

      - name: Tidy + vet
        working-directory: packages/cli-go
        run: |
          go mod tidy
          go vet ./...

      - name: Build
        working-directory: packages/cli-go
        run: go build ./...

  auth-service-go:
    name: Build + vet (auth-service)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/auth-service/go.sum

      - name: Tidy + vet
        working-directory: services/auth-service
        run: |
          go mod tidy
          go vet ./...

      # TEMPORARY — go.sum committed to the repo is missing entries this
      # job's own `go mod tidy` silently fills in on its own ephemeral
      # checkout, never persisted. Print the corrected file so it can be
      # copied back into the real committed go.sum. Remove once done.
      - name: Print corrected go.sum
        working-directory: services/auth-service
        run: cat go.sum

      - name: Build
        working-directory: services/auth-service
        run: go build ./...

  dashboard:
    name: Lint + build (dashboard)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint
        working-directory: dashboard
        run: npm run lint

      - name: Typecheck + build
        working-directory: dashboard
        run: npm run build

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [backend]

    strategy:
      matrix:
        service: [api-gateway, agent-runtime, eval-service, trace-collector]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: agentforge/${{ matrix.service }}:ci

  docker-build-auth-service:
    name: Docker build (auth-service)
    runs-on: ubuntu-latest
    needs: [auth-service-go]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build auth-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/auth-service/Dockerfile
          push: false
          tags: agentforge/auth-service:ci

  docker-build-dashboard:
    name: Docker build (dashboard, production image)
    runs-on: ubuntu-latest
    needs: [dashboard]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dashboard production image
        uses: docker/build-push-action@v6
        with:
          context: dashboard
          file: dashboard/Dockerfile.prod
          push: false
          tags: agentforge/dashboard:ci
