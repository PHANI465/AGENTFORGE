name: CD

# Two tiers, both opt-in beyond the free GHCR push:
#
# 1. push-ghcr — always runs on a push to main once CI is green. Publishes
#    every service image to GitHub Container Registry using the built-in
#    GITHUB_TOKEN. Free, no AWS account needed, works out of the box.
#
# 2. push-ecr / deploy-eks — gated behind the `DEPLOY_TO_AWS` repository
#    variable (Settings → Secrets and variables → Actions → Variables).
#    Per ADR-003 (CLAUDE.md), this project runs on a $0 AWS budget with no
#    always-on cloud resources, so these jobs are OFF by default and simply
#    skip. Flip the variable to "true" (after `terraform apply`-ing
#    infra/terraform and setting AWS_DEPLOY_ROLE_ARN) to actually deploy.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # required for AWS OIDC role assumption in push-ecr

jobs:
  push-ghcr:
    name: Push ${{ matrix.service }} to GHCR
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'

    strategy:
      matrix:
        include:
          - service: api-gateway
            dockerfile: services/api-gateway/Dockerfile
            context: .
          - service: agent-runtime
            dockerfile: services/agent-runtime/Dockerfile
            context: .
          - service: eval-service
            dockerfile: services/eval-service/Dockerfile
            context: .
          - service: trace-collector
            dockerfile: services/trace-collector/Dockerfile
            context: .
          - service: auth-service
            dockerfile: services/auth-service/Dockerfile
            context: .
          - service: dashboard
            dockerfile: dashboard/Dockerfile.prod
            context: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agentforge-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/agentforge-${{ matrix.service }}:sha-${{ github.sha }}

  push-ecr:
    name: Push ${{ matrix.service }} to ECR
    runs-on: ubuntu-latest
    if: vars.DEPLOY_TO_AWS == 'true'
    needs: [push-ghcr]

    strategy:
      matrix:
        include:
          - service: api-gateway
            dockerfile: services/api-gateway/Dockerfile
            context: .
          - service: agent-runtime
            dockerfile: services/agent-runtime/Dockerfile
            context: .
          - service: eval-service
            dockerfile: services/eval-service/Dockerfile
            context: .
          - service: trace-collector
            dockerfile: services/trace-collector/Dockerfile
            context: .
          - service: auth-service
            dockerfile: services/auth-service/Dockerfile
            context: .
          - service: dashboard
            dockerfile: dashboard/Dockerfile.prod
            context: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/agentforge/${{ matrix.service }}:latest
            ${{ steps.ecr.outputs.registry }}/agentforge/${{ matrix.service }}:sha-${{ github.sha }}

  deploy-eks:
    name: helm upgrade --install
    runs-on: ubuntu-latest
    if: vars.DEPLOY_TO_AWS == 'true'
    needs: [push-ecr]

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: azure/setup-helm@v4

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ vars.AWS_REGION || 'us-east-1' }} --name agentforge-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}

      # LB_CONTROLLER_ROLE_ARN / EXTERNAL_DNS_ROLE_ARN come from
      # `terraform output` after infra-apply.yml has provisioned
      # infra/terraform/modules/{lb-controller-irsa,external-dns-irsa} for
      # this environment — lb-controller-irsa needs only enable_ingress =
      # true (a public ALB URL, no domain required); external-dns-irsa
      # needs enable_tls = true (a real domain's Route53 record). Copy
      # whichever apply, into repo secrets, same as POSTGRES_DSN/REDIS_URL
      # below. Each step is skipped entirely if its secret is unset, so
      # this is a no-op until an environment actually turns that flag on.
      - name: Install AWS Load Balancer Controller
        if: vars.DEPLOY_TO_AWS == 'true' && env.LB_CONTROLLER_ROLE_ARN != ''
        env:
          LB_CONTROLLER_ROLE_ARN: ${{ secrets.LB_CONTROLLER_ROLE_ARN }}
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName=agentforge-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }} \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${{ secrets.LB_CONTROLLER_ROLE_ARN }} \
            --wait --timeout 5m

      - name: Install external-dns
        if: vars.DEPLOY_TO_AWS == 'true' && env.EXTERNAL_DNS_ROLE_ARN != ''
        env:
          EXTERNAL_DNS_ROLE_ARN: ${{ secrets.EXTERNAL_DNS_ROLE_ARN }}
        run: |
          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
          helm repo update
          helm upgrade --install external-dns external-dns/external-dns \
            --namespace kube-system \
            --set provider=aws \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${{ secrets.EXTERNAL_DNS_ROLE_ARN }} \
            --set txtOwnerId=agentforge-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }} \
            --wait --timeout 5m

      - name: Deploy
        working-directory: infra/helm/agentforge
        run: |
          helm upgrade --install agentforge . \
            -f values.yaml -f values-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}.yaml \
            --set-string global.imageRegistry=${{ steps.ecr.outputs.registry }}/agentforge \
            --set-string global.imageTag=sha-${{ github.sha }} \
            --set-string externalConfig.postgresDsn=${{ secrets.POSTGRES_DSN }} \
            --set-string externalConfig.redisUrl=${{ secrets.REDIS_URL }} \
            --set-string externalConfig.openaiApiKey=${{ secrets.OPENAI_API_KEY }} \
            --set-string externalConfig.encryptionMasterKey=${{ secrets.ENCRYPTION_MASTER_KEY }} \
            --set-string ingress.annotations."alb\.ingress\.kubernetes\.io/certificate-arn"=${{ secrets.ACM_CERTIFICATE_ARN }} \
            --set-string ingress.annotations."alb\.ingress\.kubernetes\.io/wafv2-acl-arn"=${{ secrets.WAF_WEB_ACL_ARN }} \
            --wait --timeout 5m
