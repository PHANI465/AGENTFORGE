[project]
name = "api-gateway"
version = "0.1.0"
description = "AgentForge API Gateway — REST API, auth, routing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "agentforge-common",
    "httpx>=0.27",
    "prometheus-fastapi-instrumentator>=7.0",
    "slowapi>=0.1.9",
    "redis>=5.0",
    "pyjwt[crypto]>=2.9",
]

[tool.uv]
package = false

[tool.uv.sources]
agentforge-common = { workspace = true }
