[project]
name = "agent-runtime"
version = "0.1.0"
description = "AgentForge Agent Runtime — execution loop, tool orchestration, safety enforcement"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "agentforge-common",
    "litellm>=1.40",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "prometheus-fastapi-instrumentator>=7.0",
    "redis>=5.0",
]

[tool.uv]
package = false

[tool.uv.sources]
agentforge-common = { workspace = true }
