name: agentforge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentforge}
      POSTGRES_DB: ${POSTGRES_DB:-agentforge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql+asyncpg://agentforge:agentforge@postgres:5432/agentforge}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - AGENT_RUNTIME_URL=http://agent-runtime:8001
      - EVAL_SERVICE_URL=http://eval-service:8002
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-}
      - DASHBOARD_ORIGINS=${DASHBOARD_ORIGINS:-http://localhost:3001,http://localhost:5173}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent-runtime:
    build:
      context: ../..
      dockerfile: services/agent-runtime/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql+asyncpg://agentforge:agentforge@postgres:5432/agentforge}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - LITELLM_PROXY_URL=${LITELLM_PROXY_URL:-http://litellm:4000}
      - TRACE_COLLECTOR_URL=http://trace-collector:8003
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  eval-service:
    build:
      context: ../..
      dockerfile: services/eval-service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql+asyncpg://agentforge:agentforge@postgres:5432/agentforge}
      - AGENT_RUNTIME_URL=http://agent-runtime:8001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  trace-collector:
    build:
      context: ../..
      dockerfile: services/trace-collector/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql+asyncpg://agentforge:agentforge@postgres:5432/agentforge}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "8004:8004"
    environment:
      - POSTGRES_DSN=${AUTH_POSTGRES_DSN:-postgresql://agentforge:agentforge@postgres:5432/agentforge}
      - AUTH_SIGNING_KEY_PEM=${AUTH_SIGNING_KEY_PEM:-}
      - OAUTH_STATE_SECRET=${OAUTH_STATE_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - OAUTH_REDIRECT_BASE_URL=${OAUTH_REDIRECT_BASE_URL:-http://localhost:8004}
      - DASHBOARD_URL=${DASHBOARD_API_BASE_URL:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      api-gateway:
        condition: service_healthy
      agent-runtime:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=agentforge
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # Milestone 8. Port 3001, not 3000 — the original plan (.env.example's
  # GRAFANA_PORT comment, ARCHITECTURE.md) put the dashboard on 3000, but
  # Grafana already claimed that port in Milestone 5 and is in active use;
  # moving it now would break every Grafana link already handed out.
  dashboard:
    build:
      context: ../../dashboard
      dockerfile: Dockerfile
    ports:
      - "3001:5173"
    environment:
      - VITE_API_BASE_URL=${DASHBOARD_API_BASE_URL:-http://localhost:8000}
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
