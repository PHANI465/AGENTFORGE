name: agentforge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentforge}
      POSTGRES_DB: ${POSTGRES_DB:-agentforge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql+asyncpg://agentforge:agentforge@postgres:5432/agentforge}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - AGENT_RUNTIME_URL=http://agent-runtime:8001
      - EVAL_SERVICE_URL=http://eval-service:8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent-runtime:
    build:
      context: ../..
      dockerfile: services/agent-runtime/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql+asyncpg://agentforge:agentforge@postgres:5432/agentforge}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - LITELLM_PROXY_URL=${LITELLM_PROXY_URL:-http://litellm:4000}
      - TRACE_COLLECTOR_URL=http://trace-collector:8003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  eval-service:
    build:
      context: ../..
      dockerfile: services/eval-service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql+asyncpg://agentforge:agentforge@postgres:5432/agentforge}
      - AGENT_RUNTIME_URL=http://agent-runtime:8001
    depends_on:
      postgres:
        condition: service_healthy

  trace-collector:
    build:
      context: ../..
      dockerfile: services/trace-collector/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql+asyncpg://agentforge:agentforge@postgres:5432/agentforge}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
