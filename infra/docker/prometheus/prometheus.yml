global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: "agent-runtime"
    metrics_path: /metrics
    static_configs:
      - targets: ["agent-runtime:8001"]

  - job_name: "eval-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["eval-service:8002"]

  - job_name: "trace-collector"
    metrics_path: /metrics
    static_configs:
      - targets: ["trace-collector:8003"]
