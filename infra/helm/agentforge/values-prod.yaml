global:
  environment: prod

ingress:
  enabled: true
  className: alb
  host: agentforge.example.com
  tlsEnabled: true
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # From `terraform output acm_certificate_arn` (envs/prod.tfvars, enable_tls = true).
    alb.ingress.kubernetes.io/certificate-arn: ""
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"

services:
  api-gateway:
    replicas: 3
    autoscaling:
      minReplicas: 3
      maxReplicas: 10
  agent-runtime:
    replicas: 3
    autoscaling:
      minReplicas: 3
      maxReplicas: 12
  eval-service:
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
  trace-collector:
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
  dashboard:
    replicas: 2
    autoscaling:
      enabled: true
