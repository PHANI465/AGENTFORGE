{{- if or .Values.externalConfig.postgresDsn .Values.externalConfig.redisUrl .Values.externalConfig.openaiApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: agentforge-secrets
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DSN: {{ .Values.externalConfig.postgresDsn | quote }}
  REDIS_URL: {{ .Values.externalConfig.redisUrl | quote }}
  OPENAI_API_KEY: {{ .Values.externalConfig.openaiApiKey | quote }}
{{- end }}
