{{- if or .Values.externalConfig.postgresDsn .Values.externalConfig.redisUrl .Values.externalConfig.openaiApiKey .Values.externalConfig.encryptionMasterKey .Values.externalConfig.authPostgresDsn .Values.externalConfig.authSigningKeyPem .Values.externalConfig.oauthStateSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: agentforge-secrets
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DSN: {{ .Values.externalConfig.postgresDsn | quote }}
  REDIS_URL: {{ .Values.externalConfig.redisUrl | quote }}
  OPENAI_API_KEY: {{ .Values.externalConfig.openaiApiKey | quote }}
  ENCRYPTION_MASTER_KEY: {{ .Values.externalConfig.encryptionMasterKey | quote }}
  # auth-service (Phase 3.3) — pgx wants a plain postgresql:// DSN, not the
  # +asyncpg dialect suffix the Python services' POSTGRES_DSN above uses.
  AUTH_POSTGRES_DSN: {{ .Values.externalConfig.authPostgresDsn | quote }}
  AUTH_SIGNING_KEY_PEM: {{ .Values.externalConfig.authSigningKeyPem | quote }}
  OAUTH_STATE_SECRET: {{ .Values.externalConfig.oauthStateSecret | quote }}
  GITHUB_CLIENT_ID: {{ .Values.externalConfig.githubClientId | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.externalConfig.githubClientSecret | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.externalConfig.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.externalConfig.googleClientSecret | quote }}
{{- end }}
