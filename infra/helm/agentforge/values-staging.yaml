global:
  environment: staging

# staging is the public demo environment (docs/deployment-runbook.md) —
# sandboxed, platform-funded, reset on a schedule so nothing a visitor
# does persists.
demo:
  resetEnabled: true

# No custom domain: host is left empty so the Ingress rule matches any
# hostname, which is all that's needed to reach the ALB's own DNS name
# directly (http://<alb-hostname>, from `kubectl get ingress`). tlsEnabled
# stays off since ACM/ALB HTTPS termination needs a real owned domain
# (enable_tls in Terraform) — see docs/deployment-runbook.md for turning
# both on later once a domain is owned.
ingress:
  enabled: true
  className: alb
  host: ""
  tlsEnabled: false
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    # From `terraform output waf_web_acl_arn` (envs/staging.tfvars, enable_waf = true).
    alb.ingress.kubernetes.io/wafv2-acl-arn: ""

services:
  api-gateway:
    replicas: 2
    env:
      # Tighter than the platform default (10/minute) — this is the public
      # demo, funded by the platform's own key and already budget-capped
      # per agent (scripts/seed.py --reset), but a lower per-key request
      # rate limits how fast one visitor can burn through that shared
      # budget before the next reset. WAF's rate-based rule (2000 req/5min
      # per IP) is the volumetric/bot defense; this is the narrower,
      # cost-fairness one.
      RATE_LIMIT_RUN: "3/minute"
  agent-runtime:
    replicas: 2
  dashboard:
    replicas: 1
  # Signup/login/OAuth need a real domain (OAuth provider redirect URIs
  # can't target a bare, rotating ALB hostname) and their own secrets
  # (signing key, OAuth app credentials) that this no-domain demo
  # deployment was never given — deploying it here would just crash-loop.
  # The demo runs on the platform's own shared API key instead (see
  # scripts/seed.py --reset); flip this on once a domain + OAuth apps exist.
  auth-service:
    enabled: false
