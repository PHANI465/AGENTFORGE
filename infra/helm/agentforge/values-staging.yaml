global:
  environment: staging

ingress:
  enabled: true
  className: alb
  host: staging.agentforge.example.com
  tlsEnabled: true
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # From `terraform output acm_certificate_arn` (envs/staging.tfvars, enable_tls = true).
    alb.ingress.kubernetes.io/certificate-arn: ""
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"

services:
  api-gateway:
    replicas: 2
  agent-runtime:
    replicas: 2
  dashboard:
    replicas: 1
