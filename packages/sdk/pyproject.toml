[project]
name = "agentforge"
version = "0.1.0"
description = "AgentForge Python SDK — define agents, tools, and safety policies"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "agentforge-common",
]

[project.scripts]
agentforge = "agentforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentforge"]

[tool.uv.sources]
agentforge-common = { workspace = true }
