[project]
name = "agentforge-common"
version = "0.1.0"
description = "Shared Pydantic models, utils, and exceptions used across all AgentForge services"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentforge_common"]
