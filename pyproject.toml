[project]
name = "agentforge-workspace"
version = "0.1.0"
description = "AgentForge — agent-native AI platform (monorepo workspace root)"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "services/api-gateway",
    "services/agent-runtime",
    "services/eval-service",
    "services/trace-collector",
    "packages/sdk",
    "packages/common",
]

[tool.uv.sources]
agentforge = { workspace = true }
agentforge-common = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
