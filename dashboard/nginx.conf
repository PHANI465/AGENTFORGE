server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — react-router-dom handles routing client-side, so any
    # path that isn't a real file (e.g. /agents/abc-123) must still serve
    # index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
